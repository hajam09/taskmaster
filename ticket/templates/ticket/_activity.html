<div class="card mt-4">
    <div class="card-body">
        <div class="collapse-header font-weight-bold" data-toggle="collapse"
             data-target="#activityPanel">
            Activity
            <span class="float-right">▼</span>
        </div>

        <div id="activityPanel" class="collapse show mt-3">
            <ul class="nav nav-pills mb-3" id="activityTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <a class="nav-link active" id="comments-tab" data-toggle="pill"
                       href="#comments-panel" role="tab" aria-controls="comments-panel"
                       aria-selected="true">Comments</a>
                </li>
                <li class="nav-item" role="presentation">
                    <a class="nav-link" id="history-tab" data-toggle="pill"
                       href="#history-panel" role="tab" aria-controls="history-panel"
                       aria-selected="false">History</a>
                </li>
            </ul>

            <div class="tab-content" id="activityTabContent">
                <div class="tab-pane fade show active" id="comments-panel" role="tabpanel"
                     aria-labelledby="comments-tab">
                    <form method="post" class="mt-3" id="addCommentForm">
                        {% csrf_token %}
                        <div class="comment-composer">
                            <div class="comment-quill-editor"></div>
                        </div>
                        <div class="comment-validation alert alert-danger d-none mt-2">
                            A comment cannot be empty.
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm mt-2">
                            Post Comment
                        </button>
                    </form>

                    <div id="ticketCommentList" class="mt-4"
                         data-comments-url="{% url 'ticket:ticket-comments' ticket.id %}"
                         data-current-user-id="{{ request.user.id }}">
                        <p class="text-muted">Loading comments...</p>
                    </div>
                </div>
                <div class="tab-pane fade" id="history-panel" role="tabpanel"
                     aria-labelledby="history-tab">
                    <p class="text-muted">Ticket history will appear here.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const commentList = document.getElementById('ticketCommentList');
        const commentUrl = commentList.dataset.commentsUrl;
        const commentEditors = new Map();
        const commentToolbar = [
            ['bold', 'italic', 'underline', 'strike'],
            [{list: 'ordered'}, {list: 'bullet'}],
            ['blockquote', 'code-block'],
            ['link'],
            ['clean']
        ];

        function initializeCommentEditor(host, initialHtml = '') {
            const quillHost = document.createElement('div');
            host.replaceChildren(quillHost);
            const quill = new Quill(quillHost, {
                theme: 'snow',
                modules: {toolbar: commentToolbar}
            });
            quill.root.innerHTML = initialHtml;
            return quill;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        function formatCommentDate(value) {
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? '' : date.toLocaleString();
        }

        function getApiError(data) {
            if (typeof data === 'string') return data;
            return Object.values(data || {}).flat().join(' ') || 'Unable to complete the request.';
        }

        function displayCommentError(error) {
            const message = document.getElementById('inlineEditMessage');
            message.className = 'alert alert-danger mt-2';
            message.textContent = error.message;
        }

        function showCommentEmptyState() {
            commentList.innerHTML = '<div class="comment-empty-state"><i class="far fa-comments" aria-hidden="true"></i><p class="mb-0">No comments yet. Start the conversation.</p></div>';
        }

        function createCommentElement(data) {
            const creator = data.creator || {};
            const name = [creator.first_name, creator.last_name].filter(Boolean).join(' ') || creator.username || 'User';
            const initials = (creator.first_name || creator.username || name).slice(0, 1).toUpperCase();
            const canEdit = String(creator.id) === commentList.dataset.currentUserId;
            const article = document.createElement('article');
            article.className = 'comment-item mb-3';
            article.dataset.commentId = data.id;

            article.innerHTML = `
                <header class="comment-header">
                    <span class="comment-avatar" aria-hidden="true">${escapeHtml(initials)}</span>
                    <div class="comment-author">
                        <strong>${escapeHtml(name)}</strong>
                        <small class="text-muted">
                            ${escapeHtml(formatCommentDate(data.createdDateTime))}
                            ${data.edited ? '<span class="comment-edited">(edited)</span>' : ''}
                        </small>
                    </div>
                    ${canEdit ? '<button type="button" class="btn btn-sm btn-link edit-comment-button ml-auto">Edit</button>' : ''}
                </header>
                <div class="comment-content"></div>
                <footer class="comment-footer">
                    <div class="comment-reactions">
                        <form method="post" class="comment-reaction-form">
                            <input type="hidden" name="csrfmiddlewaretoken" value="${escapeHtml(getCookie('csrftoken'))}">
                            <input type="hidden" name="comment-id" value="${data.id}">
                            <button type="submit" name="like-ticket-comment" value="1"
                                    class="btn btn-sm comment-reaction-button comment-like-button ${data.inLikes ? 'is-active' : ''}"
                                    aria-label="Like comment" aria-pressed="${Boolean(data.inLikes)}">
                                <i class="fa fa-thumbs-up"></i>
                                <span class="comment-like-count">${Number(data.likesCount) || 0}</span>
                            </button>
                        </form>
                        <form method="post" class="comment-reaction-form">
                            <input type="hidden" name="csrfmiddlewaretoken" value="${escapeHtml(getCookie('csrftoken'))}">
                            <input type="hidden" name="comment-id" value="${data.id}">
                            <button type="submit" name="dislike-ticket-comment" value="1"
                                    class="btn btn-sm comment-reaction-button comment-dislike-button ${data.inDisLikes ? 'is-active' : ''}"
                                    aria-label="Dislike comment" aria-pressed="${Boolean(data.inDisLikes)}">
                                <i class="fa fa-thumbs-down"></i>
                                <span class="comment-dislike-count">${Number(data.disLikesCount) || 0}</span>
                            </button>
                        </form>
                    </div>
                </footer>
                ${canEdit ? `
                <form class="comment-edit-form d-none mt-3">
                    <div class="comment-quill-editor"></div>
                    <div class="comment-validation alert alert-danger d-none mt-2">A comment cannot be empty.</div>
                    <button type="submit" class="btn btn-primary btn-sm mt-2">Save</button>
                    <button type="button" class="btn btn-light btn-sm mt-2 cancel-comment-edit">Cancel</button>
                </form>` : ''}
            `;
            article.querySelector('.comment-content').innerHTML = data.comment || '';
            return article;
        }

        async function loadTicketComments() {
            try {
                const response = await fetch(commentUrl);
                const comments = await response.json();
                if (!response.ok) throw new Error('Unable to load comments.');
                commentList.replaceChildren();
                if (!comments.length) {
                    showCommentEmptyState();
                    return;
                }
                comments.forEach(comment => commentList.append(createCommentElement(comment)));
            } catch (error) {
                commentList.textContent = error.message;
            }
        }

        const addCommentForm = document.getElementById('addCommentForm');
        const addCommentQuill = initializeCommentEditor(
            addCommentForm.querySelector('.comment-quill-editor')
        );

        addCommentForm.addEventListener('submit', async event => {
            event.preventDefault();
            const validation = addCommentForm.querySelector('.comment-validation');
            if (!addCommentQuill.getText().trim()) {
                validation.classList.remove('d-none');
                return;
            }
            validation.classList.add('d-none');
            const button = addCommentForm.querySelector('button[type="submit"]');
            button.disabled = true;
            try {
                const response = await fetch(commentUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({comment: addCommentQuill.root.innerHTML})
                });
                const data = await response.json();
                if (!response.ok) throw new Error(getApiError(data));
                commentList.querySelector('.comment-empty-state')?.remove();
                commentList.prepend(createCommentElement(data));
                addCommentQuill.setText('');
            } catch (error) {
                displayCommentError(error);
            } finally {
                button.disabled = false;
            }
        });

        commentList.addEventListener('click', event => {
            const editButton = event.target.closest('.edit-comment-button');
            if (editButton) {
                const comment = editButton.closest('.comment-item');
                const form = comment.querySelector('.comment-edit-form');
                form.classList.remove('d-none');
                comment.querySelector('.comment-content').classList.add('d-none');
                comment.querySelector('.comment-footer').classList.add('d-none');
                editButton.classList.add('d-none');
                const quill = initializeCommentEditor(
                    form.querySelector('.comment-quill-editor'),
                    comment.querySelector('.comment-content').innerHTML
                );
                commentEditors.set(form, quill);
                quill.focus();
            }

            const cancelButton = event.target.closest('.cancel-comment-edit');
            if (cancelButton) {
                const comment = cancelButton.closest('.comment-item');
                const form = cancelButton.closest('.comment-edit-form');
                form.classList.add('d-none');
                comment.querySelector('.comment-content').classList.remove('d-none');
                comment.querySelector('.comment-footer').classList.remove('d-none');
                comment.querySelector('.edit-comment-button').classList.remove('d-none');
            }
        });

        commentList.addEventListener('submit', async event => {
            const form = event.target;
            if (form.matches('.comment-edit-form')) {
                event.preventDefault();
                const quill = commentEditors.get(form);
                const validation = form.querySelector('.comment-validation');
                if (!quill.getText().trim()) {
                    validation.classList.remove('d-none');
                    return;
                }
                validation.classList.add('d-none');
                const comment = form.closest('.comment-item');
                const button = form.querySelector('button[type="submit"]');
                button.disabled = true;
                try {
                    const response = await fetch(`${commentUrl}${comment.dataset.commentId}/`, {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCookie('csrftoken')
                        },
                        body: JSON.stringify({comment: quill.root.innerHTML})
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(getApiError(data));
                    comment.querySelector('.comment-content').innerHTML = data.comment;
                    comment.querySelector('.comment-author small').innerHTML =
                        `${escapeHtml(formatCommentDate(data.createdDateTime))} <span class="comment-edited">(edited)</span>`;
                    form.classList.add('d-none');
                    comment.querySelector('.comment-content').classList.remove('d-none');
                    comment.querySelector('.comment-footer').classList.remove('d-none');
                    comment.querySelector('.edit-comment-button').classList.remove('d-none');
                } catch (error) {
                    displayCommentError(error);
                } finally {
                    button.disabled = false;
                }
            }

            if (!form.matches('.comment-reaction-form')) return;
            event.preventDefault();
            const button = event.submitter;
            const comment = form.closest('.comment-item');
            button.disabled = true;
            try {
                const response = await fetch(`${commentUrl}${comment.dataset.commentId}/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        reaction: button.name === 'like-ticket-comment' ? 'like' : 'dislike'
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(getApiError(data));
                comment.querySelector('.comment-like-count').textContent = data.likesCount;
                comment.querySelector('.comment-dislike-count').textContent = data.disLikesCount;
                const likeButton = comment.querySelector('.comment-like-button');
                const dislikeButton = comment.querySelector('.comment-dislike-button');
                likeButton.classList.toggle('is-active', data.inLikes);
                likeButton.setAttribute('aria-pressed', data.inLikes);
                dislikeButton.classList.toggle('is-active', data.inDisLikes);
                dislikeButton.setAttribute('aria-pressed', data.inDisLikes);
            } catch (error) {
                displayCommentError(error);
            } finally {
                button.disabled = false;
            }
        });

        loadTicketComments();
    });
</script>
