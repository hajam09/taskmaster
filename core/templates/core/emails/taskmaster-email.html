<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ emailHeading }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f8; color:#253247; font-family:Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="background-color:#f4f6f8; padding:32px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                       style="max-width:560px; background-color:#ffffff; border:1px solid #e4e9ef; border-radius:8px;">
                    <tr>
                        <td style="padding:28px 36px; background-color:#172b4d; border-radius:8px 8px 0 0;">
                            <span style="color:#ffffff; font-size:22px; font-weight:bold; letter-spacing:0.3px;">
                                TaskMaster
                            </span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:36px;">
                            <h1 style="margin:0 0 20px; color:#172b4d; font-size:24px; line-height:1.3;">
                                {{ emailHeading }}
                            </h1>
                            <p style="margin:0 0 16px; font-size:16px; line-height:1.6;">
                                Hello {{ userName }},
                            </p>
                            <p style="margin:0 0 24px; color:#526173; font-size:15px; line-height:1.7;">
                                {{ emailMessage }}
                            </p>
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px;">
                                <tr>
                                    <td align="center" bgcolor="#1769e0" style="border-radius:5px;">
                                        <a href="{{ actionUrl }}"
                                           style="display:inline-block; padding:13px 22px; color:#ffffff; font-size:15px; font-weight:bold; text-decoration:none;">
                                            {{ actionLabel }}
                                        </a>
                                    </td>
                                </tr>
                            </table>
                            <p style="margin:0 0 8px; color:#68778a; font-size:13px; line-height:1.6;">
                                {{ actionHint }}
                            </p>
                            <p style="margin:0; font-size:13px; line-height:1.6; overflow-wrap:anywhere;">
                                <a href="{{ actionUrl }}" style="color:#1769e0;">{{ actionUrl }}</a>
                            </p>
                            <hr style="height:1px; margin:28px 0; border:0; background-color:#e4e9ef;">
                            <p style="margin:0; color:#68778a; font-size:13px; line-height:1.6;">
                                {{ emailNote }}
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:18px 36px; background-color:#f8fafc; border-radius:0 0 8px 8px;">
                            <p style="margin:0; color:#8290a1; font-size:12px; line-height:1.5;">
                                Thanks,<br>
                                The TaskMaster team
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
